name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref (a new push to a branch/PR aborts the previous, in-flight run).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build+test (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-26, rid: osx-arm64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
    steps:
      - uses: actions/checkout@v7

      # The agent's net11.0-macos head links the Microsoft macOS bindings (and Syphon.NET) against the macOS 26.5
      # SDK; macos-26 ships Xcode 26.5 as the default, but pin it so a default bump can't regress the toolchain.
      - name: Select Xcode 26.5 (macOS)
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      # The agent's net11.0-macos head needs the macos workload (NETSDK1147 otherwise); the preview SDK no longer
      # bundles it.
      - name: Install macos workload (macOS)
        if: runner.os == 'macOS'
        run: dotnet workload install macos

      # BtbN's LGPL FFmpeg loads VAAPI via an implib stub that aborts (SIGABRT) if libva is absent, so the HW-codec
      # probe tests crash on a bare runner. Provide the VAAPI runtime; device init still fails gracefully headless.
      - name: Install libva (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libva2 libva-drm2

      # Hardware codec libraries. Desktop RIDs use BtbN LGPL builds; macOS uses Homebrew's ffmpeg.
      - name: Fetch FFmpeg (Windows/Linux)
        if: runner.os != 'macOS'
        shell: pwsh
        run: ./eng/fetch-ffmpeg.ps1 -Rids ${{ matrix.rid }}

      # macOS: Homebrew's ffmpeg is VideoToolbox-enabled, but it installs under the Homebrew prefix where the
      # loader never looks. Symlink the dylibs into native/ffmpeg/<rid> so FFmpegLibrary's dev-fallback finds
      # them (and hevc_videotoolbox encode/decode works).
      - name: Install + link FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          mkdir -p native/ffmpeg/${{ matrix.rid }}
          ln -sf "$(brew --prefix ffmpeg)"/lib/*.dylib native/ffmpeg/${{ matrix.rid }}/
          ls -l native/ffmpeg/${{ matrix.rid }}/

      - name: Restore
        run: dotnet restore StreamTransport.slnx

      - name: Build
        run: dotnet build StreamTransport.slnx -c Release --no-restore

      # The gating suite: everything except TestCategory=Integration. Integration covers full real-socket E2E
      # tests (HttpListener relay + loopback ICE/DTLS/SRTP) that are intermittently slow-or-stuck to establish
      # under a loaded CI host - a connect race specific to rapid in-process loopback setup, not a logic bug
      # (cross-machine runs connect reliably; the per-component logic is covered by the WebRtc unit + loopback
      # tests here). Keeping them off the gate stops a transient flake from blocking every build. (#1)
      - name: Test
        run: dotnet test StreamTransport.slnx -c Release --no-build --filter "TestCategory!=Integration" -- --coverage --coverage-settings coverage.settings.xml --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      # Non-gating: exercise the real-socket E2E integration tests once (Linux, most reliable loopback) so they
      # still get coverage, but a transient connect flake is reported, not fatal.
      - name: Summarize coverage
        # Renders the cobertura totals into the run summary. Uploading the raw XML alone means nobody
        # ever looks at it; this puts the numbers on the run page itself.
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET

          files = sorted(glob.glob('**/coverage.cobertura.xml', recursive=True))
          if not files:
              print('### Coverage\n\nNo coverage report was produced.')
              raise SystemExit(0)

          # Multi-targeted runs emit one report per TFM; they cover the same code, so report the first
          # and note how many were produced rather than double-counting.
          root = ET.parse(files[0]).getroot()

          def pct(attr):
              return float(root.get(attr) or 0) * 100

          print('### Coverage\n')
          print('| Metric | Covered | Total | Rate |')
          print('| --- | ---: | ---: | ---: |')
          print(f"| Lines | {root.get('lines-covered')} | {root.get('lines-valid')} | {pct('line-rate'):.1f}% |")
          print(f"| Branches | {root.get('branches-covered')} | {root.get('branches-valid')} | {pct('branch-rate'):.1f}% |")

          packages = root.findall('.//package')
          if packages:
              print('\n<details><summary>Per assembly</summary>\n')
              print('| Assembly | Lines | Branches |')
              print('| --- | ---: | ---: |')
              for p in sorted(packages, key=lambda p: p.get('name') or ''):
                  lr = float(p.get('line-rate') or 0) * 100
                  br = float(p.get('branch-rate') or 0) * 100
                  print(f"| {p.get('name')} | {lr:.1f}% | {br:.1f}% |")
              print('\n</details>')

          if len(files) > 1:
              print(f"\n_{len(files)} reports produced (one per target framework); totals shown for `{files[0]}`._")
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          if-no-files-found: warn
          path: '**/coverage.cobertura.xml'

      - name: Integration tests (non-gating)
        if: matrix.rid == 'linux-x64'
        continue-on-error: true
        run: dotnet test StreamTransport.slnx -c Release --no-build --filter "TestCategory=Integration"
