name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref (a new push to a branch/PR aborts the previous, in-flight run).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build+test (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-26, rid: osx-arm64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
    steps:
      - uses: actions/checkout@v7

      # The sister libraries build from source until each is released: CI checks out their main branches
      # beside this repo and points the build at them, as a development machine with the clones does.
      - name: Check out sister libraries
        shell: bash
        run: |
          for repo in Dtls.Core FFmpeg.Interop PipeWire.NET Spout2.NET Syphon.NET; do
            git clone --depth 1 "https://github.com/Agash/$repo.git" "$RUNNER_TEMP/deps/$repo"
          done
          {
            echo "DtlsCoreProject=$RUNNER_TEMP/deps/Dtls.Core/src/Dtls.Core/Dtls.Core.csproj"
            echo "FFmpegInteropProject=$RUNNER_TEMP/deps/FFmpeg.Interop/src/FFmpeg.Interop/FFmpeg.Interop.csproj"
            echo "PipeWireNetMediaProject=$RUNNER_TEMP/deps/PipeWire.NET/src/PipeWire.NET.Media/PipeWire.NET.Media.csproj"
            echo "Spout2NetProject=$RUNNER_TEMP/deps/Spout2.NET/src/Spout2.NET/Spout2.NET.csproj"
            echo "SyphonNetProject=$RUNNER_TEMP/deps/Syphon.NET/src/Syphon.NET/Syphon.NET.csproj"
          } >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      # BtbN's LGPL FFmpeg loads VAAPI via an implib stub that aborts (SIGABRT) if libva is absent, so the HW-codec
      # probe tests crash on a bare runner. Provide the VAAPI runtime; device init still fails gracefully headless.
      - name: Install libva (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libva2 libva-drm2

      # Hardware codec libraries. Desktop RIDs use BtbN LGPL builds; macOS uses Homebrew's ffmpeg.
      - name: Fetch FFmpeg (Windows/Linux)
        if: runner.os != 'macOS'
        shell: pwsh
        run: ./eng/fetch-ffmpeg.ps1 -Rids ${{ matrix.rid }}

      # macOS: Homebrew's ffmpeg is VideoToolbox-enabled. Symlink its dylibs into native/ffmpeg/<rid> so
      # FFmpegLibrary's dev fallback finds them, and fail early if Homebrew has moved to another major.
      - name: Install + link FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          ls "$(brew --prefix ffmpeg)"/lib/libavcodec.63.dylib
          mkdir -p native/ffmpeg/${{ matrix.rid }}
          ln -sf "$(brew --prefix ffmpeg)"/lib/*.dylib native/ffmpeg/${{ matrix.rid }}/
          ls -l native/ffmpeg/${{ matrix.rid }}/

      # The macOS package targets net11.0-macos, which needs the macos workload. The image's default Xcode
      # is its newest, which the unpinned workload manifest is built against; the log names it.
      - name: Install macos workload (macOS)
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version
          dotnet workload install macos

      - name: Restore
        run: dotnet restore StreamTransport.slnx

      - name: Check formatting
        run: |
          dotnet tool restore
          dotnet csharpier check .

      - name: Build
        run: dotnet build StreamTransport.slnx -c Release --no-restore

      # The gating suite: everything except TestCategory=Integration, which needs real sockets or a live
      # server (the relay over HttpListener, ICE over loopback UDP, coturn). PeerConnection behaviour runs here
      # on an in-memory network.
      - name: Test
        run: dotnet test --solution StreamTransport.slnx -c Release --no-build --filter "TestCategory!=Integration" -- --coverage --coverage-settings coverage.settings.xml --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.rid }}
          if-no-files-found: warn
          path: "**/coverage.cobertura.xml"

      - name: Integration tests (non-gating)
        if: matrix.rid == 'linux-x64'
        continue-on-error: true
        run: dotnet test --solution StreamTransport.slnx -c Release --no-build --filter "TestCategory=Integration"

  coverage:
    name: Coverage (all legs merged)
    # Each operating system's package and test project run only there (Windows, macOS, Linux), and the
    # core runs everywhere, so the figure that means anything is the union of every leg's reports.
    needs: [build-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage

      - name: Merge
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem coverage -Recurse -Filter '*.cobertura.xml' | ForEach-Object FullName)
          $totals = ./eng/merge-coverage.ps1 -Reports $reports -Output merged.cobertura.xml
          [xml]$merged = Get-Content -Raw merged.cobertura.xml
          $rows = foreach ($package in $merged.coverage.packages.package | Sort-Object name) {
            "| $($package.name) | $(([double]$package.'line-rate').ToString('P1')) | $(([double]$package.'branch-rate').ToString('P1')) |"
          }
          @(
            '### Coverage, all CI legs merged'
            ''
            '| Metric | Covered | Total | Rate |'
            '| --- | ---: | ---: | ---: |'
            "| Lines | $($totals.LinesCovered) | $($totals.LinesValid) | $($totals.Lines.ToString('P1')) |"
            "| Branches | $($totals.BranchesCovered) | $($totals.BranchesValid) | $($totals.Branches.ToString('P1')) |"
            ''
            '<details><summary>Per assembly</summary>'
            ''
            '| Assembly | Lines | Branches |'
            '| --- | ---: | ---: |'
            $rows
            ''
            '</details>'
          ) | Add-Content $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-merged
          path: merged.cobertura.xml
