name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # upload release assets

# Serialize releases per ref; never cancel a publish that is already in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- NuGet packages via OIDC trusted publishing (no stored API key) ----
  nuget:
    runs-on: ubuntu-latest
    # Declaring an environment is what makes GitHub record a deployment, which is what
    # surfaces the Deployments tab and the package link on the repo home page.
    environment:
      name: nuget.org
      url: https://www.nuget.org/packages/Agash.StreamTransport
    permissions:
      id-token: write
      contents: read
      # Signing the provenance statement for the packages this job produces.
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      # Codecs.FFmpeg packs the natives of every RID it ships for.
      - name: Fetch FFmpeg
        shell: pwsh
        run: ./eng/fetch-ffmpeg.ps1 -Rids win-x64,win-arm64,linux-x64,linux-arm64

      # Packs every IsPackable project in the solution; tests, samples and tools opt out.
      - name: Pack
        run: dotnet pack StreamTransport.slnx -c Release -o artifacts

      - name: Verify the FFmpeg package carries its natives
        shell: bash
        run: |
          pkg=$(ls artifacts/Agash.StreamTransport.Codecs.FFmpeg.*.nupkg | head -1)
          fail=0
          for rid in win-x64 win-arm64 linux-x64 linux-arm64; do
            unzip -Z1 "$pkg" | grep -q "^runtimes/$rid/native/" || { echo "::error::$pkg has no natives for $rid"; fail=1; }
          done
          exit $fail

      - name: Attest build provenance
        # Records, in a signed statement GitHub hosts, which workflow and which commit produced
        # these exact package files, so a consumer can tell them from a republished copy. Attested
        # before the push, so nothing reaches NuGet.org without a provenance record.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/*.nupkg

      # Trusted publishing: exchange the GitHub OIDC token for a short-lived NuGet.org key.
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: Agash

      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

  # ---- Relay + coturn Docker image to Docker Hub ----
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Docker Hub publishing is optional: it runs only once DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets are
      # configured. Until then the job no-ops (stays green) instead of failing the release on a missing login.
      - name: Check Docker Hub credentials
        id: dh
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Docker Hub secrets not configured - skipping relay image publish."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.dh.outputs.ready == 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.dh.outputs.ready == 'true'
      - uses: docker/login-action@v4
        if: steps.dh.outputs.ready == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        if: steps.dh.outputs.ready == 'true'
        with:
          images: agash/streamtransport-relay
      - uses: docker/build-push-action@v7
        if: steps.dh.outputs.ready == 'true'
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
